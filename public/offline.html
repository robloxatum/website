<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#061525" />
    <title>You're offline · Roblox at UM</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #061525; color: #f5f7fa; }
      body {
        display: grid; place-items: center; min-height: 100dvh; padding: 24px;
        box-sizing: border-box; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
      }
      main { max-width: 22rem; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { margin: 20px 0 8px; font-size: 1.6rem; }
      p { margin: 0 0 24px; color: #a9bed0; }
      a {
        display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 24px;
        border-radius: 12px; background: #f0c413; color: #081f40; font-weight: 700; text-decoration: none;
      }
      a:focus-visible { outline: 3px solid #f5f7fa; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/v2/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Roblox at UM needs a connection. Check your Wi-Fi or data, then try again.</p>
      <a href="">Try again</a>
    </main>
  </body>
</html>
