name: End-to-end tests

on: push

# The job only reads the code; nothing in it needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Actions are pinned to a commit (tags can be moved); the comment is the
    # release it was. Update both together.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Same Node as local development (.nvmrc), so they can't drift.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Production allows Google sign-in only: fails if email, phone or anonymous
      # sign-in is ever on (reads the public /auth/v1/settings; changes nothing).
      - run: node scripts/check-prod-auth.mjs
      # Unit tests first: they're fast.
      - run: npm test
      # Local Supabase in Docker (the runner has Docker). The script refuses to run
      # against anything but this machine, and no production secrets exist here.
      - run: npm run test:e2e
        env:
          CI: "1"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
