name: End-to-end tests

on: push

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Unit tests first: they're fast.
      - run: npm test
      # Local Supabase in Docker (the runner has Docker). The script refuses to run
      # against anything but this machine, and no production secrets exist here.
      - run: npm run test:e2e
        env:
          CI: "1"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
